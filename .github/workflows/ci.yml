name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Refuses broken lessons and French/Arabic drift.
      - run: npm run build
      - name: App scripts parse
        run: for f in www/js/*.js; do node --check "$f"; done
